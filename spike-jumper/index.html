<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spike Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrapper">
    <!-- Bloom overlay (composited with screen blend) -->
    <canvas id="bloom"></canvas>
    <!-- Main game canvas -->
    <canvas id="game"></canvas>

    <!-- Title Screen -->
    <div id="title-screen" class="overlay">
      <div class="title-text">SPIKE<br>RUNNER</div>
      <div class="subtitle">CYBERPUNK ENDLESS RUNNER</div>
      <div class="controls-hint">
        <span class="key">SPACE / ↑</span> Jump &nbsp;&nbsp;
        <span class="key">D / SHIFT</span> Phase Shift
      </div>
      <div class="prompt blink">PRESS SPACE · TAP TO START</div>
      <div class="hiscore-display">BEST: <span id="hi-dist">0</span>m</div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="go-header">GAME OVER</div>
      <div class="go-stat">DISTANCE &nbsp;<span id="go-dist">0</span>m</div>
      <div class="go-stat">SCORE &nbsp;&nbsp;&nbsp;<span id="go-score">0</span></div>
      <div class="go-zone">REACHED: <span id="go-zone">—</span></div>
      <div class="go-best" id="go-best"></div>
      <div class="prompt blink" style="margin-top:2em">SPACE / TAP TO RETRY</div>
    </div>

    <!-- HUD overlay (crisp HTML text over canvas) -->
    <div id="hud" class="hidden">
      <span id="hud-dist"></span>
      <span id="hud-mult"></span>
      <span id="hud-emp"></span>
    </div>

    <!-- Zone announcement banner -->
    <div id="zone-banner" class="zone-banner hidden"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
