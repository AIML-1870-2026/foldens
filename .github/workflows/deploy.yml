name: Deploy RxLens to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'drug-safety-explorer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-rxlens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: drug-safety-explorer/package-lock.json

      - name: Install dependencies
        working-directory: drug-safety-explorer
        run: npm ci

      - name: Build
        working-directory: drug-safety-explorer
        env:
          VITE_OPENFDA_API_KEY: ${{ secrets.VITE_OPENFDA_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: drug-safety-explorer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-rxlens
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
