name: Build RxLens

on:
  push:
    branches: [main]
    paths:
      - 'drug-safety-explorer/src/**'
      - 'drug-safety-explorer/vite.config.js'
      - 'drug-safety-explorer/package*.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: drug-safety-explorer/package-lock.json

      - name: Install dependencies
        working-directory: drug-safety-explorer
        run: npm ci

      - name: Build
        working-directory: drug-safety-explorer
        env:
          VITE_OPENFDA_API_KEY: ${{ secrets.VITE_OPENFDA_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Commit and push built output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drug-safety-explorer/index.html drug-safety-explorer/assets/
          git diff --cached --quiet || git commit -m "Build: update RxLens dist [skip ci]"
          git push
