name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-blackjack-agent/package-lock.json

      - name: Build ai-blackjack-agent
        run: |
          cd ai-blackjack-agent
          npm ci
          npm run build

      - name: Commit built files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the compiled output inside ai-blackjack-agent/
          git add ai-blackjack-agent/index.html ai-blackjack-agent/assets/ --force

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit — build output is unchanged."
          else
            git commit -m "chore: build ai-blackjack-agent [skip ci]"
            git push origin main
          fi
