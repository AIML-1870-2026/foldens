; ESPotify - ESP32 Spotify Device
; PlatformIO Configuration

[env:huzzah32]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200

; Partition scheme: minimal SPIFFS, maximum app space
board_build.partitions = min_spiffs.csv

; Upload speed
upload_speed = 921600

; Build flags for Bluetooth + WiFi coexistence
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BLUEDROID_ENABLED=1

lib_deps =
    pschatzmann/ESP32-A2DP@^1.8.3
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    kosme/arduinoFFT@^2.0.2
    bblanchon/ArduinoJson@^5.13.5
