; ESPotify - ESP32 Spotify Device
; PlatformIO Configuration

[env:huzzah32]
platform = espressif32@^6.9.0   ; arduino-esp32 2.0.x: enables CONFIG_MBEDTLS_DYNAMIC_BUFFER
board = featheresp32
framework = arduino
monitor_speed = 115200

; Partition scheme: minimal SPIFFS, maximum app space
board_build.partitions = min_spiffs.csv

; Upload / monitor port
upload_port = COM6
monitor_port = COM6
upload_speed = 921600

; Build flags for Bluetooth + WiFi coexistence
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BLUEDROID_ENABLED=1

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
    adafruit/Adafruit SH110X@^2.1.10
    adafruit/Adafruit GFX Library@^1.11.5
    kosme/arduinoFFT@^2.0.2
    bblanchon/ArduinoJson@^7.0.0
