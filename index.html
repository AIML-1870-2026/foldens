<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foldens</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: #000000;
            color: #f5f5f5;
            height: 100vh;
            width: 100vw;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .greeting {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            opacity: 0.9;
            max-width: 600px;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 3rem;
            pointer-events: none;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #f5f5f5;
            background: rgba(127, 255, 0, 0.15);
            border: 1px solid rgba(127, 255, 0, 0.4);
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(127, 255, 0, 0.3);
            border-color: rgba(127, 255, 0, 0.8);
            box-shadow: 0 0 20px rgba(127, 255, 0, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            #particleCanvas {
                display: none;
            }
        }

        @media (max-width: 768px) {
            h1 {
                margin-bottom: 1rem;
            }

            .greeting {
                font-size: 1.1rem;
                margin-bottom: 2rem;
            }

            .nav-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="content">
        <h1>foldens</h1>
        <p class="greeting">I am ready to vibe code</p>
        <nav class="nav-buttons">
            <a href="LLM-switchboard/" class="nav-btn">LLM Switchboard</a>
            <a href="spike-jumper/" class="nav-btn">Spike Jumper</a>
            <a href="drug-safety-explorer/dist/" class="nav-btn">RxLens</a>
            <a href="Turing-Patterns-Explorer/" class="nav-btn">Turing Patterns</a>
            <a href="julia-set-explorer/" class="nav-btn">Julia Set Explorer</a>
            <a href="RGB-Color-Studio/" class="nav-btn">RGB Color Studio</a>
            <a href="Readable/" class="nav-btn">Readable</a>
            <a href="weather-app/dist/" class="nav-btn">Weather App</a>
            <a href="quick-decide/" class="nav-btn">Quick Decide</a>
            <a href="blackjack/dist/" class="nav-btn">Blackjack</a>
            <a href="boids/boids-mini-lab/" class="nav-btn">Boids</a>
            <a href="meteor-showcase/" class="nav-btn">Meteor Showcase</a>
            <a href="snake-reloaded/" class="nav-btn">Snake Reloaded</a>
            <a href="stellar-web/" class="nav-btn">Stellar Web</a>
            <a href="starfield/" class="nav-btn">Starfield</a>
            <a href="game-showcase/" class="nav-btn">Towers of Time</a>
            <a href="hello-world/" class="nav-btn">Hello World</a>
        </nav>
    </div>

    <script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            let mouse = { x: null, y: null, radius: 150 };

            window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
            window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                }
            });
            window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

            const colors = [
                { r: 127, g: 255, b: 0 },
                { r: 173, g: 255, b: 47 },
                { r: 0, g: 255, b: 127 },
                { r: 50, g: 205, b: 50 },
                { r: 154, g: 255, b: 102 },
                { r: 57, g: 255, b: 20 }
            ];

            class Particle {
                constructor() { this.reset(); }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 120 + 60;
                    this.baseSize = this.size;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.opacity = Math.random() * 0.3 + 0.4;
                    this.angle = Math.random() * Math.PI * 2;
                    this.angleSpeed = (Math.random() - 0.5) * 0.015;
                    this.blur = Math.random() * 15 + 10;
                    this.targetX = this.x;
                    this.targetY = this.y;
                    this.offset = Math.random() * Math.PI * 2;
                    this.waveSpeed = Math.random() * 0.015 + 0.008;
                }

                update() {
                    this.offset += this.waveSpeed;
                    this.targetX += this.speedX + Math.sin(this.offset) * 0.3;
                    this.targetY += this.speedY + Math.cos(this.offset * 0.7) * 0.3;

                    if (this.targetX > canvas.width + this.size) this.targetX = -this.size;
                    if (this.targetX < -this.size) this.targetX = canvas.width + this.size;
                    if (this.targetY > canvas.height + this.size) this.targetY = -this.size;
                    if (this.targetY < -this.size) this.targetY = canvas.height + this.size;

                    if (mouse.x != null && mouse.y != null) {
                        const dx = mouse.x - this.targetX;
                        const dy = mouse.y - this.targetY;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            const force = (mouse.radius - distance) / mouse.radius;
                            const angle = Math.atan2(dy, dx);
                            this.targetX -= Math.cos(angle) * force * 8;
                            this.targetY -= Math.sin(angle) * force * 8;
                            this.size = this.baseSize * (1 + force * 0.3);
                        } else {
                            this.size += (this.baseSize - this.size) * 0.1;
                        }
                    } else {
                        this.size += (this.baseSize - this.size) * 0.1;
                    }

                    this.x += (this.targetX - this.x) * 0.05;
                    this.y += (this.targetY - this.y) * 0.05;
                    this.angle += this.angleSpeed;
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);

                    ctx.shadowBlur = this.blur * 2;
                    ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity * 0.8})`;
                    ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity * 0.3})`;

                    ctx.beginPath();
                    const points = 6;
                    for (let i = 0; i < points; i++) {
                        const angle = (Math.PI * 2 * i) / points;
                        const variance = Math.sin(this.offset * 3 + i) * 0.25 + 0.9;
                        const radius = this.size * variance / 2;
                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            const prevAngle = (Math.PI * 2 * (i - 1)) / points;
                            const prevVariance = Math.sin(this.offset * 3 + (i - 1)) * 0.25 + 0.9;
                            const prevRadius = this.size * prevVariance / 2;
                            ctx.quadraticCurveTo((Math.cos(prevAngle) * prevRadius + x) / 2 * 1.3, (Math.sin(prevAngle) * prevRadius + y) / 2 * 1.3, x, y);
                        }
                    }
                    ctx.closePath();
                    ctx.fill();

                    ctx.shadowBlur = this.blur;
                    ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;

                    ctx.beginPath();
                    for (let i = 0; i < points; i++) {
                        const angle = (Math.PI * 2 * i) / points;
                        const variance = Math.sin(this.offset * 3 + i) * 0.25 + 0.9;
                        const radius = this.size * variance / 2 * 0.7;
                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            const prevAngle = (Math.PI * 2 * (i - 1)) / points;
                            const prevVariance = Math.sin(this.offset * 3 + (i - 1)) * 0.25 + 0.9;
                            const prevRadius = this.size * prevVariance / 2 * 0.7;
                            ctx.quadraticCurveTo((Math.cos(prevAngle) * prevRadius + x) / 2 * 1.3, (Math.sin(prevAngle) * prevRadius + y) / 2 * 1.3, x, y);
                        }
                    }
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            const isMobile = window.innerWidth < 768;
            const particleCount = isMobile ? 8 : 12;
            const particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(particle => {
                    particle.update();
                    particle.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
